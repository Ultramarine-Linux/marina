[profile.release]
opt-level = "z"          # Optimization level (0-3, s, z)
lto = "fat"            # Link-Time Optimization, including surrealdb-librocksdb-sys
codegen-units = 1      # Better optimization, slower compile
panic = "abort"        # Smaller binary, no unwinding
strip = true            # Strip debug symbols

[workspace]

resolver = "3"
members = [
    "crates/marina-core", "crates/marina-library",
    "crates/marina-romm",
    "crates/marina-store-surrealdb",
    "crates/marina-test",
    "crates/marina-ui-slint",
]

[workspace.package]
readme = "README.md"
rust-version = "1.95"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dotenvy = "0.15"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
url = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5"] }

# marina
marina-core = { path = "crates/marina-core" }
marina-romm = { path = "crates/marina-romm" }
marina-library = { path = "crates/marina-library" }
marina-store-surrealdb = { path = "crates/marina-store-surrealdb" }
