[Distribution]
Distribution=fedora
Architecture=arm64

[Output]
Format=sysext
Output=marina
OutputDirectory=../../target/marina-sysext
CompressOutput=no

[Build]
# Keep repository/package downloads and intermediary image layers across
# `just sysext-build` invocations. These are build artifacts, not image input.
Incremental=yes
CacheDirectory=../../target/mkosi/cache
PackageCacheDirectory=../../target/mkosi/packages

[Content]
ExtraTrees=../../target/marina-sysext-root
CleanPackageMetadata=no
