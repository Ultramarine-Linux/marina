[package]
name = "marina-ui-slint"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
debug-mcp = ["slint/mcp"]
live-preview = ["slint/live-preview"]

[build-dependencies]
lucide-slint = "1.38.0"
slint-build = "1.17.1"

[dependencies]
bytesize.workspace = true
chrono.workspace = true
# Keep the renderer set explicit: Winit uses Skia over OpenGL/OpenGL ES, and
# Skia falls back to its software surface when GL initialization fails.
# Do not enable the Vulkan or WGPU renderer features on the handheld target.
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-skia-opengl",
    "accessibility",
    "compat-1-2",
    "log",
    "serde",
    "raw-window-handle-06",
    "image-default-formats",
] }
i-slint-core.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }

dirs.workspace = true
dotenvy.workspace = true
figment.workspace = true
marina-apps.workspace = true
marina-config-derive.workspace = true
marina-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
marina-library.workspace = true
marina-romm.workspace = true
marina-scanner.workspace = true
marina-store-sqlite.workspace = true
marina-store.workspace = true
marina-input.workspace = true
marina-runtime.workspace = true
marina-power.workspace = true
reqwest.workspace = true
resvg.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
