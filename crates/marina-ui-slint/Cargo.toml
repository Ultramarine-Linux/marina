[package]
name = "marina-ui-slint"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
debug-mcp = ["slint/mcp"]
live-preview = ["slint/live-preview"]

[build-dependencies]
slint-build = "1.17.1"

[dependencies]
slint = { version = "1.17.1", features = [
    "log",
    "serde",
    "raw-window-handle-06",
    "image-default-formats",
] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }

dotenvy.workspace = true
marina-core.workspace = true
serde.workspace = true
serde_json.workspace = true
marina-library.workspace = true
marina-romm.workspace = true
marina-install.workspace = true
marina-scanner.workspace = true
marina-store-sqlite.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
