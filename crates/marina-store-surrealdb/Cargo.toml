[package]
name = "marina-store-surrealdb"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
surrealdb = { version = "3.2.4", features = ["kv-mem", "kv-surrealkv", "kv-rocksdb"] }
# Activate rust-rocksdb's LTO feature for its transitive sys crate.
surrealdb-librocksdb-sys = {
    package = "surrealdb-librocksdb-sys",
    version = "0.18.3",
    default-features = false,
    features = ["lto"],
}
surrealkit = "0.7"
marina-core.workspace = true
marina-library.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio.workspace = true
